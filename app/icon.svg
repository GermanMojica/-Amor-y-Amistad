<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Gift Box Body -->
  <rect x="25" y="44" width="50" height="36" rx="8" fill="url(#primaryGrad)"/>
  
  <!-- Gift Lid -->
  <rect x="20" y="34" width="60" height="12" rx="4" fill="#F43F5E"/>
  
  <!-- Ribbon Vertical -->
  <rect x="45" y="34" width="10" height="46" fill="url(#accentGrad)"/>
  
  <!-- Bow -->
  <circle cx="43" cy="27" r="7" fill="none" stroke="#A5B4FC" stroke-width="3"/>
  <circle cx="57" cy="27" r="7" fill="none" stroke="#A5B4FC" stroke-width="3"/>
  <circle cx="50" cy="29" r="4" fill="#A5B4FC"/>
</svg>
